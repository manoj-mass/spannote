version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - '@angular/*'
          - 'ng-packagr'
      vue:
        patterns:
          - 'vue'
          - '@vue/*'
          - 'vite'
          - '@vitejs/*'
          - 'vue-tsc'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Changesets action v2 needs @changesets/cli v3. Upgrade the CLI first, then this.
      - dependency-name: changesets/action
        update-types: ['version-update:semver-major']
